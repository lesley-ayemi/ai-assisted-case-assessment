[project]
name = "case-intel-backend"
version = "0.1.0"
description = "AI-assisted preliminary case assessment for solicitor review (England & Wales contract disputes)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "anthropic>=0.70",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic
